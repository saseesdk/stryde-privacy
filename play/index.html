<body><div class="wrap"><header class="top"><a class="wordmark" href="/">Stryde <span style="font-weight:500;color:var(--muted);font-size:14px">by Bueno Works</span></a></header>
<div class="hero"><h1>Opening Google Play…</h1><p>Launching Saturday 7 November. Pre-register and you'll get it the moment it's live.</p>
<a class="play" href="https://play.google.com/store/apps/details?id=io.stepearn.step_earn&amp;utm_source=instagram&amp;utm_campaign=prereg"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.2 2.6 13.6 12l-9.4 9.4c-.4-.2-.7-.7-.7-1.3V3.9c0-.6.3-1.1.7-1.3Zm10.7 8.1 2.6-2.6 3.2 1.8c.9.5.9 1.8 0 2.3l-3.2 1.8-2.6-2.6v-.7Zm-.7 1.3 2.4 2.4-11 6.3 8.6-8.7Zm0-1.3L5.6 2.1l11 6.3-2.4 2.6Z"/></svg><span><small>Pre-register on</small>Google Play</span></a>
<p style="color:var(--muted);font-size:14px">Nothing happened? Tap the button. On iPhone? <a href="/#join">Leave your email</a> and we'll tell you when it's on the App Store.</p></div></div>
<script>
// Instagram's in-app browser can't pre-register on the Play web page; an intent: link opens the Play Store app.
(() => {
  const a = document.querySelector('a.play'), web = a.href;
  if (!/Android/i.test(navigator.userAgent)) return;
  a.href = `intent://details?${new URL(web).search.slice(1)}#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=${encodeURIComponent(web)};end`;
  location.href = a.href;
})();
</script></body></html>
