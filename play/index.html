<script>
// Instagram's in-app browser can't install from the Play web page; an intent: link opens the Play Store app.
(() => {
  const a = document.querySelector('a.play');
  // Forward the visitor's own utm_* tags (e.g. ?utm_source=youtube&utm_medium=longform) in Play's referrer format, so installs are attributed.
  const q = new URLSearchParams(location.search), u = new URL(a.href), r = new URLSearchParams(u.searchParams.get('referrer') || '');
  for (const k of ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content']) if (q.get(k)) r.set(k, q.get(k).slice(0, 60));
  u.searchParams.set('referrer', r.toString()); a.href = u.toString();
  const web = a.href;
  if (!/Android/i.test(navigator.userAgent)) return;
  a.href = `intent://details?${new URL(web).search.slice(1)}#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=${encodeURIComponent(web)};end`;
  location.href = a.href;
})();
</script></body></html>
